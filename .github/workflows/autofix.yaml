name: autofix.ci
on:
  pull_request:
    paths:
      - aqua.yaml
      - aqua-checksums.json
      - go.mod
      - go.sum
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6-beta
        with:
          persist-credentials: false
      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
      - name: Fix aqua-checksums.json
        run: aqua upc -prune
      # NOTE: workground https://github.com/golang/go/issues/75031
      - id: parse-go-version
        run: echo "GO_VERSION=$(cat aqua.yaml | grep "golang/go" | cut -f2 -d'@')" >> $GITHUB_OUTPUT
      - run: go env -w GOTOOLCHAIN="${GO_VERSION}+auto"
        env:
          GO_VERSION: ${{ steps.parse-go-version.outputs.GO_VERSION }}
      - name: Tidy Go modules
        run: go mod tidy
      - name: Run autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
