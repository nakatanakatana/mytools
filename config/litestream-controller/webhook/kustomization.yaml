apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- manifests.yaml
- service.yaml

patches:
- target:
    group: admissionregistration.k8s.io
    version: v1
    kind: MutatingWebhookConfiguration
    name: mutating-webhook-configuration
  patch: |-
    - op: add
      path: /webhooks/0/namespaceSelector
      value:
        matchLabels:
          litestream.mytools.nakatanakatana.app/injection: enabled
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
          - litestream-controller-system
    - op: add
      path: /webhooks/0/matchConditions
      value:
      - name: litestream-injection-request
        expression: has(object.metadata.annotations) && 'litestream.mytools.nakatanakatana.app/inject' in object.metadata.annotations && object.metadata.annotations['litestream.mytools.nakatanakatana.app/inject'].trim() != ''
