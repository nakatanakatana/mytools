apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litestream-controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: litestream-controller
    control-plane: controller-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: litestream-controller
