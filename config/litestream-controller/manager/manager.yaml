apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    app.kubernetes.io/name: litestream-controller
---
# Injected Pods (and therefore any cluster running this controller) require
# Kubernetes 1.29 or later: the Litestream replication container is injected
# as a native sidecar (initContainers[].restartPolicy: Always), a feature
# enabled by default in Kubernetes 1.29 and stable from Kubernetes 1.33.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litestream-controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: litestream-controller
    control-plane: controller-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: litestream-controller
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: litestream-controller
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            control-plane: controller-manager
            app.kubernetes.io/name: litestream-controller
      serviceAccountName: litestream-controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: manager
        image: ghcr.io/nakatanakatana/litestream-controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        ports:
        - name: webhook-server
          containerPort: 9443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: webhook-server-cert
      terminationGracePeriodSeconds: 10
